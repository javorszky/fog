name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  automerge:
    # Checks the PR author, not github.actor, which a re-run can change.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Major updates can break the release workflow, which CI does not run; review them by hand.
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        # --auto merges only after the required status checks pass.
        run: gh pr merge --auto --squash "$PR_URL"
